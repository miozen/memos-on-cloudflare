name = "cfmemos"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/file/*", "/u/*", "/explore/rss.xml"]

[vars]
INSTANCE_NAME = "cfmemos"
APP_VERSION = "1.0.0"

[[d1_databases]]
binding = "DB"
database_name = "cfmemos-db"
database_id = "7dd36e3f-1389-470a-b4b5-20feb89ee867"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cfmemos"

[[kv_namespaces]]
binding = "CACHE"
id = "5863263bc8dc420e801f219f249a806d"

[ai]
binding = "AI"
