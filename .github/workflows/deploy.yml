name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Check backend types and tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Check frontend types, tests, and build
        run: |
          npm --prefix web exec tsc -- --noEmit --skipLibCheck
          npm --prefix web test
          npm run build:web
